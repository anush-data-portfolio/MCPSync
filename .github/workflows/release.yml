name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            asset: mcpsync-darwin-arm64
          - goos: darwin
            goarch: amd64
            asset: mcpsync-darwin-amd64
          - goos: linux
            goarch: amd64
            asset: mcpsync-linux-amd64
          - goos: linux
            goarch: arm64
            asset: mcpsync-linux-arm64
          - goos: windows
            goarch: amd64
            asset: mcpsync-windows-amd64.exe

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -o dist/${{ matrix.asset }} ./mcpsync

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: List binaries
        run: ls -lh dist

      - name: Generate checksums
        run: sha256sum dist/* > dist/checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-npm:
    name: Publish npm package
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Sync package version with tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          node -e "
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.version = process.env.VERSION.replace(/^v/, '');
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  verify-release:
    name: Verify release binary
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Download and run released binary
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          curl -fsSL -o /tmp/mcpsync \
            "https://github.com/anush-data-portfolio/MCPSync/releases/download/${REF_NAME}/mcpsync-linux-amd64"
          curl -fsSL -o /tmp/checksums.txt \
            "https://github.com/anush-data-portfolio/MCPSync/releases/download/${REF_NAME}/checksums.txt"
          EXPECTED=$(grep 'mcpsync-linux-amd64' /tmp/checksums.txt | awk '{print $1}')
          ACTUAL=$(sha256sum /tmp/mcpsync | awk '{print $1}')
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "Checksum mismatch: expected $EXPECTED, got $ACTUAL" >&2
            exit 1
          fi
          chmod +x /tmp/mcpsync
          /tmp/mcpsync --version
