name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt into Node.js 24 before it becomes mandatory (June 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  security-events: write  # required for uploading SARIF to the Security tab

jobs:
  # ── go vet (fast gate) ──────────────────────────────────────────────────────
  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: go vet
        run: go vet ./...

  # ── Build & Test ────────────────────────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Verify module graph
        run: go mod tidy && git diff --exit-code go.sum go.mod

      - name: Build
        run: |
          CGO_ENABLED=0 go build \
            -ldflags="-s -w -X github.com/anush-data-portfolio/MCPSync/cmd.version=ci-${{ github.sha }}" \
            -o /dev/null ./mcpsync

      - name: Test with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./... -v -count=1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: coverage.out
          fail_ci_if_error: false

  # ── golangci-lint ───────────────────────────────────────────────────────────
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6
        with:
          version: v1.64.8
          args: --timeout=5m

  # ── Semgrep SAST ────────────────────────────────────────────────────────────
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.163.0
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Semgrep scan (Go security + secrets)
        run: |
          semgrep scan \
            --config=p/golang \
            --config=p/secrets \
            --sarif \
            --output=semgrep.sarif \
            . || true   # non-zero exit on findings; upload SARIF regardless
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Block CI on high-severity findings
        run: |
          semgrep scan \
            --config=p/golang \
            --config=p/secrets \
            --severity=ERROR \
            --error \
            .
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
